<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2a3140">
<title>保險大富翁 Prototype</title>
<style>
  :root{
    --ink:#3a2f28;          /* 外框深咖啡 */
    --paper:#f7efdc;        /* 面板米色 */
    --paper-2:#efe2c4;
    --gold:#f2c14e;
    --green:#2e9e6b;
    --red:#d64545;
    --blue:#2a6fb0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#1f2430;
    font-family:"Cubic 11","Zpix","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink);
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}

  /* 全螢幕：手機直式、電腦橫式都填滿畫面 */
  #app{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#b7cdd8}
  canvas#game{position:absolute;inset:0;display:block;image-rendering:pixelated}

  /* ---------- 共用：像素風面板 ---------- */
  .panel{background:var(--paper);border:2px solid var(--ink);border-radius:10px;
    box-shadow:inset 0 -3px 0 var(--paper-2),0 3px 0 rgba(0,0,0,.25)}
  .hidden{display:none!important}

  /* ---------- 上方 HUD ---------- */
  .hud-top{position:absolute;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));
    display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
  #profile{display:flex;gap:8px;padding:7px 10px 7px 7px;align-items:center;pointer-events:auto;min-width:0}
  #avatar{width:48px;height:48px;flex:none;border-radius:50%;border:2px solid var(--ink);
    background:radial-gradient(circle at 50% 40%,#fdf6e6,#e8d6b0);image-rendering:pixelated}
  .who{min-width:0}
  .who .name{font-size:13px;font-weight:bold;display:flex;align-items:center;gap:6px;white-space:nowrap}
  .who .name small{color:#a07a3a;font-weight:bold}
  .bar{width:96px;height:8px;border:2px solid var(--ink);border-radius:5px;background:#fff;overflow:hidden}
  #levelBar{height:100%;width:0;background:linear-gradient(#ffd27a,#f2a93b);transition:width .4s}
  #insRow{display:flex;gap:3px;margin-top:5px}
  .ins{width:20px;height:20px;display:grid;place-items:center;font-size:11px;font-weight:bold;
    border:2px solid #9b8d7a;border-radius:5px;background:#e6dccb;color:#9b8d7a}
  .ins.on{border-color:var(--ink);background:#7cc8f5;color:#173a5a;box-shadow:inset 0 -2px 0 #4c9fd1}

  .pills{display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:auto}
  .pill{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 6px;font-size:13px;font-weight:bold;white-space:nowrap;
    background:rgba(42,49,64,.88);color:#fff;border:2px solid #11151d;border-radius:999px}
  .pill .ico{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--gold);color:var(--ink)}
  #cashPill.neg{color:#ffb3b3}


  /* ---------- 角色頭上的對話框 ---------- */
  #bubble{position:absolute;transform:translate(-50%,calc(-100% - 12px));padding:5px 14px;white-space:nowrap;
    font-size:15px;font-weight:bold;background:#fffaf0;border:2px solid var(--ink);border-radius:6px;
    box-shadow:0 3px 0 rgba(0,0,0,.2);pointer-events:none;z-index:2}
  #bubble::after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);
    border:6px solid transparent;border-top-color:var(--ink)}
  .float{position:absolute;transform:translate(-50%,-100%);font-weight:bold;font-size:18px;pointer-events:none;z-index:3;
    text-shadow:2px 0 #fff,-2px 0 #fff,0 2px #fff,0 -2px #fff;animation:rise 1.1s ease-out forwards}
  .float.gain{color:var(--green)} .float.loss{color:var(--red)}
  @keyframes rise{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-44px}}

  /* ---------- 下方圓形按鈕 ---------- */
  .hud-bottom{position:absolute;left:50%;transform:translateX(-50%);width:100%;max-width:520px;bottom:calc(14px + env(safe-area-inset-bottom));
    display:flex;justify-content:space-between;align-items:flex-end;padding:0 14px;pointer-events:none}
  /* 橫式（電腦）：資訊面板、按鈕、事件卡、對話框全部放大 */
  @media (orientation: landscape) and (min-width: 800px){
    .hud-top{left:24px;right:24px;top:20px}
    #profile{transform:scale(1.45);transform-origin:top left}
    .pills{transform:scale(1.45);transform-origin:top right}
    .hud-bottom{max-width:400px;bottom:26px;transform:translateX(-50%) scale(1.3);transform-origin:bottom center}
    #card{bottom:210px;max-width:480px;padding:20px 24px 22px}
    #cardTitle{font-size:24px;margin-bottom:10px}
    #cardText{font-size:18px}
    .btn{font-size:17px;padding:10px 24px}
    .cover-row,.log-list{font-size:16px}
    #bubble{font-size:20px;padding:7px 18px;border-width:3px}
    .float{font-size:26px}
  }
  .round-btn{pointer-events:auto;font:inherit;border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
  .round-btn .disc{display:grid;place-items:center;border-radius:50%;border:3px solid var(--ink);
    background:radial-gradient(circle at 50% 35%,#fffaf0,#e9dbbd);box-shadow:0 4px 0 rgba(0,0,0,.3)}
  .round-btn.small .disc{width:56px;height:56px;font-size:24px}
  .round-btn .label{font-size:12px;font-weight:bold;color:#fff;padding:1px 8px;border-radius:6px;background:rgba(42,49,64,.88);border:2px solid #11151d}
  .round-btn:active .disc{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.3)}

  #rollBtn .disc{width:92px;height:92px;background:radial-gradient(circle at 50% 30%,#ffb26b,#ff7a2e);
    box-shadow:0 0 0 4px #fff3d6,0 0 0 7px var(--ink),0 7px 0 4px rgba(0,0,0,.3)}
  #rollBtn .label{font-size:14px;background:var(--ink)}
  #rollBtn:disabled{cursor:default}
  #rollBtn:disabled .disc{filter:grayscale(.75) brightness(.9)}
  #dice{width:48px;height:48px;background:#fff;border:3px solid var(--ink);border-radius:9px;
    display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:5px;box-shadow:inset 0 -3px 0 #ddd}
  #dice span{display:block;margin:auto;width:8px;height:8px}
  #dice span.on{background:var(--ink)}
  #dice.rolling{animation:shake .12s infinite}
  @keyframes shake{0%{transform:rotate(-10deg)}50%{transform:rotate(10deg) translateY(-3px)}100%{transform:rotate(-10deg)}}

  /* ---------- 事件卡 ---------- */
  #card{position:absolute;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);
    width:calc(100% - 32px);max-width:360px;text-align:center;padding:14px 16px 16px;z-index:5;
    animation:pop .18s ease-out}
  @keyframes pop{from{transform:translateX(-50%) scale(.9);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
  #cardTitle{font-size:18px;font-weight:bold;margin-bottom:6px}
  #cardText{font-size:14px;line-height:1.65}
  #card[data-tone="good"] #cardTitle{color:var(--green)}
  #card[data-tone="bad"] #cardTitle{color:var(--red)}
  #card[data-tone="ins"] #cardTitle{color:var(--blue)}
  #cardBtns{display:flex;gap:10px;justify-content:center;margin-top:12px}
  .btn{font:inherit;font-size:14px;font-weight:bold;padding:8px 18px;border:2px solid var(--ink);border-radius:8px;
    background:#fff;box-shadow:0 3px 0 var(--ink);cursor:pointer}
  .btn.primary{background:var(--green);color:#fff}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .cover-list{display:flex;flex-direction:column;gap:6px;text-align:left;margin-top:4px;max-height:46vh;overflow:auto}
  .cover-row{display:flex;gap:8px;align-items:center;font-size:13px;padding:5px 6px;border-radius:6px;background:#fff8ea}
  .cover-row small{color:#8a7a68}
  .log-list{text-align:left;font-size:13px;line-height:1.7;max-height:46vh;overflow:auto}
  .log-list b, #cardText b{color:var(--green)}
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <div class="hud-top">
    <div id="profile" class="panel">
      <canvas id="avatar" width="24" height="24"></canvas>
      <div class="who">
        <div class="name">小保 <small>保障等級 <span id="level">0</span></small></div>
        <div style="display:flex;align-items:center;gap:6px;margin-top:3px">
          <div class="bar"><div id="levelBar"></div></div><small id="levelText" style="font-size:11px;font-weight:bold">0/6</small>
        </div>
        <div id="insRow"></div>
      </div>
    </div>
    <div class="pills">
      <div class="pill" id="cashPill"><span class="ico">$</span><span id="cash">10,000</span></div>
      <div class="pill"><span class="ico">🎲</span>第 <span id="round">1</span> 回合</div>
    </div>
  </div>

  <div id="bubble" class="hidden"></div>

  <div id="card" class="panel hidden">
    <div id="cardTitle"></div>
    <div id="cardText"></div>
    <div id="cardBtns"></div>
  </div>

  <div class="hud-bottom">
    <button id="coverBtn" class="round-btn small"><span class="disc">🛡️</span><span class="label">我的保障</span></button>
    <button id="rollBtn" class="round-btn"><span class="disc"><span id="dice"></span></span><span class="label">擲骰子</span></button>
    <button id="logBtn" class="round-btn small"><span class="disc">📜</span><span class="label">事件紀錄</span></button>
  </div>
</div>

<script src="js/vendor/three.min.js"></script>
<script src="js/data.js"></script>
<script src="js/grid.js"></script>
<script src="js/grid-tracker.js"></script>
<script src="js/world.js"></script>
<script src="js/traffic.js"></script>
<script src="js/game.js"></script>
</body>
</html>
